[package]
name = "office-chat"
version = "0.1.0"
edition = "2021"

[lib]
name = "office_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = ["tray-icon"] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
# Ensures only one OfficeChat runs at a time; a second launch focuses the first.
tauri-plugin-single-instance = "2"

# Native toast with click-to-open support. The notification plugin's desktop
# backend never wires up click handling, so we send message toasts ourselves.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"

[target.'cfg(not(windows))'.dependencies]
notify-rust = "4"
