[package]
name = "office-chat"
version = "0.1.0"
edition = "2021"

[lib]
name = "office_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0" }

[dependencies]
tauri = { version = "2.8.0", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
