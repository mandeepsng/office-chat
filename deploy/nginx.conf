# OfficeChat — Nginx reverse proxy for HTTPS/WSS.
#
# 1. Replace chat.example.com with your domain (A-record -> VPS IP).
# 2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/officechat
# 3. sudo ln -s /etc/nginx/sites-available/officechat /etc/nginx/sites-enabled/
# 4. sudo nginx -t && sudo systemctl reload nginx
# 5. sudo certbot --nginx -d chat.example.com   # adds SSL + redirects 80->443
#
# certbot rewrites this file to add the listen 443 / ssl_certificate lines.

server {
    listen 80;
    server_name chat.example.com;

    # WebSocket + HTTP both proxy to the Node server on localhost:8787.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # Required for WebSocket upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep long-lived WebSocket connections open (default is 60s).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
